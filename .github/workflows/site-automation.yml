name: CS Digital Finds Site Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
  push:
    branches: [main, affiliate-connectors]
    paths:
      - 'data/**'
      - 'automation/**'
      - '.github/workflows/site-automation.yml'

permissions:
  contents: read

jobs:
  validate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import authorized CJ and Awin affiliate feeds when configured
        env:
          CJ_FEED_URL: ${{ secrets.CJ_FEED_URL }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: python automation/import_affiliate_feeds.py
      - name: Import Amazon products through Creators API when configured
        env:
          AMAZON_CREATOR_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATOR_CREDENTIAL_ID }}
          AMAZON_CREATOR_SECRET: ${{ secrets.AMAZON_CREATOR_SECRET }}
          AMAZON_PARTNER_TAG: csdigitalfinds-20
        run: python automation/import_amazon_creators.py
      - name: Validate centralized product catalog
        run: python automation/validate_products.py
      - name: Audit site SEO and affiliate-link markup
        run: python automation/audit_site.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: automation/audit-report.json
