name: CS Digital Finds SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * 1'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'automation/audit_site.py'
      - '.github/workflows/seo-audit.yml'

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SEO and affiliate-link markup audit
        run: python automation/audit_site.py
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: automation/audit-report.json
